AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions ECR publishing role restricted to one repository and branch. Tagged env=test-eks.
Parameters:
  ClusterName:
    Type: String
  GitHubRepository:
    Type: String
    Description: OWNER/REPO containing the EKS directory contents at its root.
    AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
  CreateProvider:
    Type: String
    AllowedValues: [ "true", "false" ]
    Default: "true"
    Description: Use false if this account already has the GitHub OIDC provider.
Conditions:
  NewProvider: !Equals [ !Ref CreateProvider, "true" ]
Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: NewProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
      - sts.amazonaws.com
      Tags:
      - Key: env
        Value: test-eks
      - Key: Project
        Value: !Ref ClusterName
  PublisherRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
      - Key: env
        Value: test-eks
      - Key: Project
        Value: !Ref ClusterName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Effect: Allow
          Principal:
            Federated: !If
              - NewProvider
              - !Ref GitHubProvider
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
          Action: sts:AssumeRoleWithWebIdentity
          Condition:
            StringEquals:
              token.actions.githubusercontent.com:aud: sts.amazonaws.com
              token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/main
      Policies:
      - PolicyName: PublishClassroomImages
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: "*"
          - Effect: Allow
            Action:
            - ecr:BatchCheckLayerAvailability
            - ecr:GetDownloadUrlForLayer
            - ecr:BatchGetImage
            - ecr:DescribeImages
            - ecr:DescribeRepositories
            - ecr:InitiateLayerUpload
            - ecr:UploadLayerPart
            - ecr:CompleteLayerUpload
            - ecr:PutImage
            Resource:
            - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ClusterName}/web
            - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ClusterName}/php
            - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ClusterName}/busybox
            - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ClusterName}/nginx-cicd
Outputs:
  PublisherRoleArn:
    Value: !GetAtt PublisherRole.Arn
